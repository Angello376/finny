<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" />
    <title>Cards Financeiros offline</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 18% 8%, rgba(34, 197, 94, 0.08), transparent 30%),
          linear-gradient(135deg, #0b1220, #111827 58%, #070b14);
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(92vw, 420px);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 8px;
        background: rgba(17, 24, 39, 0.86);
        padding: 28px;
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.32);
      }

      span {
        display: inline-grid;
        width: 52px;
        height: 52px;
        place-items: center;
        border-radius: 8px;
        background: rgba(34, 197, 94, 0.12);
        color: #22c55e;
        font-size: 26px;
        font-weight: 900;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 28px;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #cbd5e1;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <span>$</span>
      <h1>Cards Financeiros</h1>
      <p>Você está offline. Abra novamente quando a conexão voltar; seus cards salvos neste dispositivo continuam preservados.</p>
    </main>
  </body>
</html>
