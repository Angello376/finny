name: Apply Store UI

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-store-ui.mjs
      - app/store/StorePanel.tsx
      - db/schema.ts
      - app/api/store/**
      - app/CardsFinanceirosApp.tsx
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply store UI patch
        run: node scripts/apply-store-ui.mjs
      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/CardsFinanceirosApp.tsx scripts/apply-store-ui.mjs app/store/StorePanel.tsx
          git commit -m "feat(store): ship intuitive flavor-first store UI"
          git push origin HEAD:main
