name: Apply Store v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply store changes
        run: node scripts/apply-store-v2.mjs
      - name: Validate TypeScript build
        run: npm install && npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f store-v2-trigger.txt scripts/apply-store-v2.mjs .github/workflows/apply-store-v2.yml
          git add db/schema.ts app/api/store app/CardsFinanceirosApp.tsx store-v2-trigger.txt scripts/apply-store-v2.mjs .github/workflows/apply-store-v2.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(store): redesign shop inventory with flavors"
          git push
